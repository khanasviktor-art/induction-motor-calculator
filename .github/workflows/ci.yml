name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install
        run: npm ci

      - name: Assemble dictionary
        run: npm run i18n

      - name: Check assembled dictionary is committed
        run: git diff --exit-code -- src/lang-en.js

      - name: Build
        run: npm run build

      - name: Check generated index.html is committed
        run: git diff --exit-code -- index.html

      - name: Tests
        run: npm test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
