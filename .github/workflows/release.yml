name: Release

# Релиз по тегу: проверяем сборку и тесты, собираем установочные файлы под
# Windows (portable exe) и macOS (dmg, arm64) и прикладываем их к GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v0.13.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install
        run: npm ci

      - name: Словарь собран
        run: npm run i18n && git diff --exit-code -- src/lang-en.js

      - name: Сборка совпадает с закоммиченной
        run: npm run build && git diff --exit-code -- index.html

      - name: Тесты
        run: npm test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

  windows:
    name: Windows exe
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Зависимости оболочки
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Собрать приложение в оболочку
        run: npm run build:desktop

      - name: Собрать portable exe
        run: node tools/run-desktop.cjs --dist

      - name: Проверить, что файл появился
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/dist -Filter *.exe -Recurse
          if (-not $exe) { throw 'exe не собран' }
          $exe | Select-Object FullName, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Загрузить exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS dmg (arm64)
    needs: verify
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Зависимости оболочки
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Собрать приложение в оболочку
        run: npm run build:desktop

      - name: Собрать dmg
        run: node tools/run-desktop.cjs --mac
        env:
          # без сертификата: сборка без подписи, приложение запускается
          # через «правый клик → Открыть»
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Проверить, что файл появился
        run: |
          ls -lh desktop/dist/*.dmg
          test -n "$(find desktop/dist -name '*.dmg')"

      - name: Загрузить dmg
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Скачать собранные файлы
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Показать состав релиза
        run: find artifacts -type f -printf '%p  %s байт\n' | sort

      - name: Создать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/windows-exe/*.exe
            artifacts/macos-dmg/*.dmg
